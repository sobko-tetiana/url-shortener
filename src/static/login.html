<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in · Shortly</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <a href="/">Back to Shortly</a>
</header>

<div id="main">
  <form id="login-form">
    <input id="email" type="email" placeholder="Email" required autofocus>
    <input id="password" type="password" placeholder="Password" required>
    <button type="submit">Log in</button>
  </form>

  <p class="auth-switch">No account? <a href="/register">Sign up</a></p>

  <p id="message"></p>
</div>

<script>
const form = document.getElementById("login-form");
const message = document.getElementById("message");

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  message.textContent = "Logging in…";

  const res = await fetch("/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password }),
  });

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    message.textContent = typeof data.detail === "string" ? data.detail : "Invalid email or password.";
    return;
  }

  const data = await res.json();
  localStorage.setItem("access_token", data.access_token);
  localStorage.setItem("refresh_token", data.refresh_token);
  localStorage.setItem("email", email);
  window.location.href = "/";
});
</script>
</body>
</html>
